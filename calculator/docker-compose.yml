version: "3.9"

networks:
  calc-net:
    driver: bridge

services:

  # ── Calculator API ────────────────────────────────────────────────────────
  calculator:
    image: ${DOCKER_HUB_USER:-your-dockerhub-username}/calculator:${BUILD_NUMBER:-latest}
    build: .                          # used for local `docker compose up --build`
    container_name: calculator-api
    restart: unless-stopped
    networks:
      - calc-net
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: calculator-proxy
    restart: unless-stopped
    networks:
      - calc-net
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
